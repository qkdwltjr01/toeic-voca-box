<title>토익 단어 상자</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
/* ============================================================
   TOKENS — light palette is the complete set on bare :root
   ============================================================ */
:root {
  /* warm-biased neutrals (nudged toward the brass accent) */
  --bg:        #F3F2EF;
  --surface:   #FFFFFF;
  --surface-2: #EBEAE5;
  --line:      #DAD8D1;
  --line-soft: #E7E5DF;
  --text:      #1A1917;
  --text-2:    #5C5A55;
  --text-3:    #8B8880;

  /* brass accent */
  --accent:     #9A6B0E;
  --accent-ink: #FFFFFF;
  --accent-wash:#F3E7CF;
  --accent-line:#D9BE85;

  /* semantic — deliberately separate from the accent hue */
  --ok:        #2C7A54;
  --ok-wash:   #DCEFE4;
  --ok-line:   #A9D3BE;
  --bad:       #B33A2E;
  --bad-wash:  #F6DFDC;
  --bad-line:  #E0AFA8;

  --shadow-1: 0 1px 2px rgba(26,25,23,.06), 0 2px 8px rgba(26,25,23,.05);
  --shadow-2: 0 2px 4px rgba(26,25,23,.07), 0 10px 28px rgba(26,25,23,.10);

  --font-display: "Iowan Old Style","Palatino Linotype","Book Antiqua",Palatino,"Source Serif Pro",Georgia,"Times New Roman",serif;
  --font-ui: Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;

  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 16px;

  --page: 560px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:        #131211;
    --surface:   #1D1C1A;
    --surface-2: #26241F;
    --line:      #34322C;
    --line-soft: #2A2823;
    --text:      #F0EEE8;
    --text-2:    #A9A69D;
    --text-3:    #7C7972;

    --accent:     #D9A648;
    --accent-ink: #201804;
    --accent-wash:#312716;
    --accent-line:#5A4620;

    --ok:        #55BC8A;
    --ok-wash:   #16291F;
    --ok-line:   #2C4E3C;
    --bad:       #EE7C6F;
    --bad-wash:  #2E1B18;
    --bad-line:  #52302B;

    --shadow-1: 0 1px 2px rgba(0,0,0,.4), 0 2px 8px rgba(0,0,0,.3);
    --shadow-2: 0 2px 4px rgba(0,0,0,.45), 0 12px 32px rgba(0,0,0,.42);
  }
}
:root[data-theme="dark"] {
  --bg:        #131211;
  --surface:   #1D1C1A;
  --surface-2: #26241F;
  --line:      #34322C;
  --line-soft: #2A2823;
  --text:      #F0EEE8;
  --text-2:    #A9A69D;
  --text-3:    #7C7972;

  --accent:     #D9A648;
  --accent-ink: #201804;
  --accent-wash:#312716;
  --accent-line:#5A4620;

  --ok:        #55BC8A;
  --ok-wash:   #16291F;
  --ok-line:   #2C4E3C;
  --bad:       #EE7C6F;
  --bad-wash:  #2E1B18;
  --bad-line:  #52302B;

  --shadow-1: 0 1px 2px rgba(0,0,0,.4), 0 2px 8px rgba(0,0,0,.3);
  --shadow-2: 0 2px 4px rgba(0,0,0,.45), 0 12px 32px rgba(0,0,0,.42);
}

/* ============================================================
   BASE
   ============================================================ */
* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-ui);
  font-size: 16px;
  line-height: 1.55;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}

h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 650; letter-spacing: -.01em; }
p { margin: 0; }
button { font: inherit; color: inherit; }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 4px;
}

.eyebrow {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .13em;
  text-transform: uppercase;
  color: var(--text-3);
}

.num { font-variant-numeric: tabular-nums; }

.shell {
  max-width: var(--page);
  margin: 0 auto;
  padding: 0 18px;
}

/* ============================================================
   TOP BAR
   ============================================================ */
.topbar {
  position: sticky;
  top: 0;
  z-index: 40;
  background: var(--bg);
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: saturate(1.6) blur(12px);
  border-bottom: 1px solid var(--line-soft);
}
.topbar-in {
  max-width: var(--page);
  margin: 0 auto;
  padding: 10px 18px;
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 52px;
}
.brand {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin-right: auto;
  min-width: 0;
}
.brand-mark {
  font-family: var(--font-display);
  font-size: 19px;
  font-weight: 600;
  letter-spacing: -.02em;
}
.brand-sub {
  font-size: 11px;
  color: var(--text-3);
  letter-spacing: .06em;
  white-space: nowrap;
}

.icon-btn {
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: var(--r-md);
  width: 38px; height: 38px;
  display: grid; place-items: center;
  cursor: pointer;
  flex: none;
  transition: background .15s, border-color .15s;
}
.icon-btn:hover { background: var(--surface-2); border-color: var(--accent-line); }
.icon-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

/* ============================================================
   DASHBOARD
   ============================================================ */
.dash { padding: 22px 0 120px; display: flex; flex-direction: column; gap: 18px; }

/* countdown block — the single loud moment on the page */
.countdown {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 20px 20px 18px;
  box-shadow: var(--shadow-1);
  display: flex;
  align-items: flex-end;
  gap: 16px;
  cursor: pointer;
  text-align: left;
  transition: border-color .15s;
}
.countdown:hover { border-color: var(--accent-line); }
.cd-main { display: flex; flex-direction: column; gap: 2px; margin-right: auto; }
.cd-days {
  font-family: var(--font-display);
  font-size: 52px;
  line-height: .92;
  font-weight: 600;
  letter-spacing: -.03em;
  font-variant-numeric: tabular-nums;
  color: var(--accent);
}
.cd-days small { font-size: 20px; letter-spacing: 0; margin-left: 2px; }
.cd-date { font-size: 12.5px; color: var(--text-2); }
.cd-side { text-align: right; display: flex; flex-direction: column; gap: 4px; }
.cd-stat { font-size: 12.5px; color: var(--text-2); }
.cd-stat b { color: var(--text); font-variant-numeric: tabular-nums; font-weight: 650; }

/* today's queue */
.queue {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  overflow: hidden;
  box-shadow: var(--shadow-1);
}
.queue-head {
  padding: 16px 20px 12px;
  display: flex;
  align-items: baseline;
  gap: 10px;
}
.queue-head h2 { font-size: 15px; margin-right: auto; }
.queue-split { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--line-soft); }
.qs {
  padding: 14px 20px 16px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.qs + .qs { border-left: 1px solid var(--line-soft); }
.qs-n {
  font-size: 30px;
  font-weight: 650;
  line-height: 1.1;
  font-variant-numeric: tabular-nums;
  letter-spacing: -.02em;
}
.qs-l { font-size: 12px; color: var(--text-2); }
.qs.is-review .qs-n { color: var(--accent); }

/* progress rail */
.rail-wrap { padding: 14px 20px 18px; border-top: 1px solid var(--line-soft); display: flex; flex-direction: column; gap: 8px; }
.rail-top { display: flex; align-items: baseline; gap: 8px; font-size: 12.5px; color: var(--text-2); }
.rail-top b { margin-left: auto; color: var(--text); font-variant-numeric: tabular-nums; }
.rail {
  height: 8px;
  border-radius: 99px;
  background: var(--surface-2);
  overflow: hidden;
  display: flex;
}
.rail-fill { background: var(--accent); transition: width .5s cubic-bezier(.2,.8,.2,1); }
.rail-fill.is-learning { background: var(--accent-line); }

/* leitner box distribution — real state, so it gets real form */
.boxes {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 16px 20px 18px;
  box-shadow: var(--shadow-1);
  display: flex; flex-direction: column; gap: 12px;
}
.boxes-head { display: flex; align-items: baseline; gap: 10px; }
.boxes-head h2 { font-size: 15px; margin-right: auto; }
.box-row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.box-cell {
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  padding: 8px 4px 7px;
  text-align: center;
  background: var(--surface-2);
  display: flex; flex-direction: column; gap: 1px;
}
.box-cell .bn { font-size: 16px; font-weight: 650; font-variant-numeric: tabular-nums; line-height: 1.2; }
.box-cell .bl { font-size: 9.5px; color: var(--text-3); letter-spacing: .04em; }
.box-cell[data-lv="5"] { background: var(--ok-wash); border-color: var(--ok-line); }
.box-cell[data-lv="5"] .bn { color: var(--ok); }
.box-cell[data-lv="0"] .bn { color: var(--text-3); }

/* mode picker */
.modes {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 16px 20px 18px;
  box-shadow: var(--shadow-1);
  display: flex; flex-direction: column; gap: 12px;
}
.modes-head { display:flex; align-items: baseline; gap: 10px; }
.modes-head h2 { font-size: 15px; margin-right: auto; }
.mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.mode-btn {
  border: 1px solid var(--line);
  background: var(--surface-2);
  border-radius: var(--r-md);
  padding: 11px 12px;
  text-align: left;
  cursor: pointer;
  display: flex; flex-direction: column; gap: 1px;
  transition: border-color .15s, background .15s;
}
.mode-btn:hover { border-color: var(--accent-line); }
.mode-btn .mt { font-size: 13.5px; font-weight: 620; }
.mode-btn .md { font-size: 11px; color: var(--text-3); }
.mode-btn[aria-pressed="true"] {
  background: var(--accent-wash);
  border-color: var(--accent);
}
.mode-btn[aria-pressed="true"] .mt { color: var(--accent); }
.mode-btn[aria-pressed="true"] .md { color: var(--text-2); }
.mode-btn.is-wide { grid-column: 1 / -1; }

.link-row { display: flex; gap: 8px; }
.link-btn {
  flex: 1;
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: var(--r-md);
  padding: 13px 12px;
  cursor: pointer;
  font-size: 13.5px;
  font-weight: 600;
  display: flex; align-items: center; justify-content: center; gap: 7px;
  box-shadow: var(--shadow-1);
  transition: border-color .15s, background .15s;
}
.link-btn:hover { border-color: var(--accent-line); background: var(--surface-2); }
/* 크기 없는 인라인 SVG는 브라우저 기본 300x150 으로 부풀어 버튼 안 글자를 밀어낸다 */
.link-btn svg, .btn-primary svg, .gbtn svg {
  width: 17px; height: 17px; flex: none;
  stroke: currentColor; fill: none; stroke-width: 1.7;
  stroke-linecap: round; stroke-linejoin: round;
}
.link-btn .pill {
  font-size: 11px; font-weight: 700;
  background: var(--bad-wash); color: var(--bad);
  border-radius: 99px; padding: 1px 7px;
  font-variant-numeric: tabular-nums;
}

/* sticky start bar (thumb zone) */
.startbar {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 50;
  padding: 12px 18px calc(12px + env(safe-area-inset-bottom));
  background: linear-gradient(to top, var(--bg) 62%, transparent);
  pointer-events: none;
}
.startbar-in { max-width: var(--page); margin: 0 auto; pointer-events: auto; }
.start-note {
  text-align: center; font-size: 12.5px; color: var(--text-2);
  padding-bottom: 8px;
}
.start-note b { color: var(--text); font-weight: 650; }
.btn-primary {
  width: 100%;
  border: none;
  border-radius: 14px;
  background: var(--accent);
  color: var(--accent-ink);
  font-size: 16px;
  font-weight: 700;
  letter-spacing: -.01em;
  padding: 17px 20px;
  cursor: pointer;
  box-shadow: var(--shadow-2);
  display: flex; align-items: center; justify-content: center; gap: 9px;
  transition: transform .12s, filter .15s;
}
.btn-primary:hover { filter: brightness(1.06); }
.btn-primary:active { transform: scale(.985); }
.btn-primary[disabled] { background: var(--surface-2); color: var(--text-3); box-shadow: none; cursor: default; }
.btn-primary .cnt {
  background: rgba(0,0,0,.16);
  background: color-mix(in srgb, var(--accent-ink) 20%, transparent);
  border-radius: 99px; padding: 1px 9px; font-size: 13px;
  font-variant-numeric: tabular-nums;
}

/* ============================================================
   STUDY SCREEN
   ============================================================ */
.study { display: flex; flex-direction: column; min-height: 100dvh; }

.study-bar {
  position: sticky; top: 0; z-index: 40;
  background: var(--bg);
  background: color-mix(in srgb, var(--bg) 90%, transparent);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line-soft);
}
.study-bar-in {
  max-width: var(--page); margin: 0 auto;
  padding: 10px 18px;
  display: flex; align-items: center; gap: 12px;
}
.sess-rail { flex: 1; height: 5px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.sess-fill { height: 100%; background: var(--accent); transition: width .35s ease; }
.sess-count { font-size: 12.5px; color: var(--text-2); font-variant-numeric: tabular-nums; white-space: nowrap; }

.stage {
  flex: 1;
  max-width: var(--page);
  width: 100%;
  margin: 0 auto;
  padding: 18px 18px 160px;
  display: flex; flex-direction: column; gap: 14px;
}

/* the card itself — index-card stock */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-2);
  padding: 26px 22px;
  display: flex; flex-direction: column; gap: 14px;
  position: relative;
  min-height: 210px;
  justify-content: center;
  touch-action: pan-y;
}
.card::before {
  /* the ruled line of an index card */
  content: "";
  position: absolute; left: 22px; right: 22px; top: 62px;
  border-top: 1px solid var(--line-soft);
  pointer-events: none;
  opacity: .0;
}
.card-meta {
  display: flex; align-items: center; gap: 8px;
  position: absolute; top: 14px; left: 22px; right: 22px;
}
.tag {
  font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  border: 1px solid var(--line); border-radius: 99px; padding: 2px 9px;
  color: var(--text-3); background: var(--surface-2);
}
.tag.is-new { color: var(--accent); border-color: var(--accent-line); background: var(--accent-wash); }
.card-meta .spacer { margin-left: auto; }

/* leitner stepper on the card = real state made visible */
.stepper { display: flex; gap: 3px; align-items: center; }
.step { width: 13px; height: 4px; border-radius: 99px; background: var(--line); }
.step.on { background: var(--accent); }

.q-word {
  font-family: var(--font-display);
  font-size: clamp(38px, 11vw, 54px);
  line-height: 1.05;
  font-weight: 600;
  letter-spacing: -.025em;
  text-align: center;
  word-break: break-word;
}
.q-ko {
  font-size: clamp(22px, 6.5vw, 30px);
  font-weight: 650;
  line-height: 1.3;
  text-align: center;
  letter-spacing: -.02em;
}
.q-pos { text-align: center; font-size: 12.5px; color: var(--text-3); letter-spacing: .06em; }
.q-hint { text-align: center; font-size: 13px; color: var(--text-3); }

.speak {
  align-self: center;
  border: 1px solid var(--line); background: var(--surface-2);
  border-radius: 99px; padding: 6px 14px 6px 11px;
  font-size: 12.5px; color: var(--text-2); cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
}
.speak:hover { border-color: var(--accent-line); color: var(--text); }
.speak svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

/* choice options */
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt {
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: var(--r-md);
  padding: 14px 16px;
  text-align: left;
  cursor: pointer;
  font-size: 15px;
  line-height: 1.35;
  display: flex; align-items: center; gap: 12px;
  box-shadow: var(--shadow-1);
  transition: border-color .13s, background .13s, transform .1s;
}
.opt:hover:not(:disabled) { border-color: var(--accent-line); }
.opt:active:not(:disabled) { transform: scale(.99); }
.opt .k {
  flex: none; width: 22px; height: 22px; border-radius: 5px;
  background: var(--surface-2); border: 1px solid var(--line);
  display: grid; place-items: center;
  font-size: 11px; font-weight: 700; color: var(--text-3);
  font-variant-numeric: tabular-nums;
}
.opt.is-ok { background: var(--ok-wash); border-color: var(--ok); color: var(--ok); font-weight: 640; }
.opt.is-ok .k { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.opt.is-bad { background: var(--bad-wash); border-color: var(--bad); color: var(--bad); }
.opt.is-bad .k { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.opt:disabled { cursor: default; }
.opt.is-dim { opacity: .45; }

/* spelling input */
.spellwrap { display: flex; flex-direction: column; gap: 10px; }
.spell-in {
  width: 100%;
  border: 1.5px solid var(--line);
  background: var(--surface);
  border-radius: var(--r-md);
  padding: 15px 16px;
  font-family: var(--font-display);
  font-size: 24px;
  letter-spacing: .01em;
  color: var(--text);
  box-shadow: var(--shadow-1);
}
.spell-in::placeholder { font-family: var(--font-ui); font-size: 15px; color: var(--text-3); letter-spacing: 0; }
.spell-in:focus { outline: none; border-color: var(--accent); }
.spell-in.is-ok { border-color: var(--ok); color: var(--ok); }
.spell-in.is-bad { border-color: var(--bad); color: var(--bad); }
.spell-mask {
  text-align: center; font-family: var(--font-display); font-size: 22px;
  letter-spacing: .22em; color: var(--text-3);
}

/* reveal panel — the teaching moment */
.reveal {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-1);
  overflow: hidden;
  animation: rise .28s cubic-bezier(.2,.8,.2,1);
}
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  .reveal { animation: none; }
  .rail-fill, .sess-fill { transition: none; }
  .btn-primary { transition: none; }
}
.rv-verdict {
  padding: 11px 18px;
  display: flex; align-items: center; gap: 9px;
  font-size: 13.5px; font-weight: 650;
  border-bottom: 1px solid var(--line-soft);
}
.rv-verdict.ok { background: var(--ok-wash); color: var(--ok); }
.rv-verdict.bad { background: var(--bad-wash); color: var(--bad); }
.rv-verdict .next-at { margin-left: auto; font-weight: 500; font-size: 12px; opacity: .85; }

.rv-sec { padding: 13px 18px; border-bottom: 1px solid var(--line-soft); display: flex; flex-direction: column; gap: 6px; }
.rv-sec:last-child { border-bottom: none; }
.rv-label { font-size: 10.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--text-3); }

.rv-mean { font-size: 15.5px; line-height: 1.5; }
.rv-mean .pos {
  font-size: 11px; font-weight: 700; color: var(--accent);
  background: var(--accent-wash); border: 1px solid var(--accent-line);
  border-radius: 4px; padding: 0 5px; margin-right: 6px;
  vertical-align: 1.5px;
}
.rv-ex-en { font-family: var(--font-display); font-size: 16px; line-height: 1.5; }
.rv-ex-en em { font-style: normal; color: var(--accent); font-weight: 600; }
.rv-ex-ko { font-size: 13.5px; color: var(--text-2); line-height: 1.5; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font-size: 13px;
  border: 1px solid var(--line); background: var(--surface-2);
  border-radius: 99px; padding: 4px 11px;
  color: var(--text-2);
}
.chip b { color: var(--text); font-weight: 620; }
.chip .p { font-size: 10.5px; color: var(--accent); font-weight: 700; margin-right: 4px; }

/* grading bar (thumb zone) */
.gradebar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
  padding: 12px 18px calc(12px + env(safe-area-inset-bottom));

const BASE = LOADED.length ? LOADED : SAMPLE_WORDS;
const IS_SAMPLE = !LOADED.length;
const BASE_SRC = "독종반";

/* 내가 등록한 단어(경선식 책 등)는 S.custom 에 저장되고, 아래에서 기본 단어 위에 얹는다.
   철자가 겹치면 새 카드를 만들지 않고 기존 단어에 연상·뜻을 붙인다 — 같은 단어를
   두 번 외우지 않기 위해서다. */
let WORDS = [], BY_ID = {}, BY_POS = {}, MAX_RANK = 0, RANK_META = [], SOURCES = [];
let HAS_DER = false, HAS_SYN = false;

function buildIndex() {
  WORDS = BASE.map(w => Object.assign({}, w, {
    means: (w.means || []).slice(),
    ex: (w.ex || []).slice(),
    marks: [],
  }));
  const byId = {};
  WORDS.forEach(w => { w.id = w.word.toLowerCase(); byId[w.id] = w; });

  Object.keys(S.custom || {}).sort().forEach(id => {
    const c = S.custom[id];
    const hit = byId[id];
    if (hit) {
      if (c.mn) hit.mn = c.mn;
      const seen = new Set(hit.means.map(m => m.pos + "|" + m.ko));
      (c.means || []).forEach(m => {
        if (!seen.has(m.pos + "|" + m.ko)) { hit.means.push(m); seen.add(m.pos + "|" + m.ko); }
      });
      if (c.ex && c.ex.length) hit.ex = hit.ex.concat(c.ex);
      if (!hit.marks.includes(c.src)) hit.marks.push(c.src);
    } else {
      const w = Object.assign({}, c, { id, rank: -1, marks: [c.src], custom: true });
      WORDS.push(w);
      byId[id] = w;
    }
  });

  WORDS.forEach((w, i) => { w.idx = i; w.mainPos = (w.means[0] && w.means[0].pos) || ""; });
  BY_ID = byId;
  /* 주 품사 — 4지선다 오답 보기를 같은 품사로 뽑아 난이도를 유지한다 */
  BY_POS = {};
  WORDS.forEach(w => { (BY_POS[w.mainPos] = BY_POS[w.mainPos] || []).push(w); });
  HAS_DER = WORDS.some(w => w.der && w.der.length);
  HAS_SYN = WORDS.some(w => w.syn && w.syn.length);

  MAX_RANK = BASE.reduce((m, w) => Math.max(m, w.rank || 0), 0);
  RANK_META = Array.from({ length: MAX_RANK + 1 }, (_, i) => {
    const ws = BASE.filter(w => w.rank === i);
    if (!ws.length) return null;
    const nos = ws.map(w => w.no || 0);
    return { i, label: `${Math.min(...nos)}–${Math.max(...nos)}`, count: ws.length };
  }).filter(Boolean);

  SOURCES = [];
  Object.values(S.custom || {}).forEach(c => { if (!SOURCES.includes(c.src)) SOURCES.push(c.src); });
  SOURCES.sort();
}

function customCount(src) {
  return Object.values(S.custom || {}).filter(c => !src || c.src === src).length;
}

/* 내 단어 저장. 이미 있는 단어면 덮어쓴다(수정과 같은 경로). */
function saveCustom({ word, pos, ko, mn, src, ex }) {
  const id = (word || "").trim().toLowerCase();
  if (!id || !(ko || "").trim()) return null;
  const source = (src || "내 단어").trim() || "내 단어";
  S.custom[id] = {
    word: word.trim(),
    means: [{ pos: (pos || "").trim(), ko: ko.trim() }],
    mn: (mn || "").trim(),
    ex: ex || [],
    src: source,
    added: (S.custom[id] && S.custom[id].added) || dayKey(),
    ts: Date.now(),
  };
  delete S.tomb[id];          // 지웠다가 다시 등록하면 묘비를 걷어낸다
  S.settings.lastSrc = source;
  if (!S.settings.sources.includes(source)) S.settings.sources.push(source);
  saveState();
  buildIndex();
  return id;
}

function deleteCustom(id) {
  delete S.custom[id];
  S.tomb[id] = Date.now();    // 다른 기기에서 동기화될 때 되살아나지 않도록
  saveState();
  buildIndex();
  // 더 이상 단어가 없는 출처는 필터에서도 치운다
  S.settings.sources = S.settings.sources.filter(s => SOURCES.includes(s));
  saveState();
}

/* 여러 줄 붙여넣기 파서.
   한 줄에 하나씩, 아래 형태를 모두 받는다:
     abandon / 버리다 / 어? 밴에 던져!      (슬래시)
     abandon<탭>버리다<탭>어? 밴에 던져!     (엑셀·표 복사)
     abandon 버리다                         (첫 한글에서 자동으로 끊음)
   앞에 붙은 "12." 같은 번호는 떼어낸다. */
function parseBulk(text) {
  const rows = [], bad = [];
  (text || "").split(/\r?\n/).forEach(raw => {
    const line = raw.trim();
    if (!line) return;

    let parts;
    if (line.includes("\t")) parts = line.split("\t");
    else if (line.includes("/")) parts = line.split("/");
    else {
      const m = line.match(/^([^가-힣]+?)\s*([가-힣].*)$/);
      parts = m ? [m[1], m[2]] : [line];
    }
    parts = parts.map(p => p.trim());
    if (parts.length > 3) parts = [parts[0], parts[1], parts.slice(2).join(" / ")];

    const word = (parts[0] || "").replace(/^\d+\s*[.)\-]?\s*/, "").trim();
    const ko = (parts[1] || "").trim();
    const mn = (parts[2] || "").trim();

    if (!word || !ko || !/^[A-Za-z][A-Za-z '\-]*$/.test(word)) { bad.push(line); return; }
    rows.push({ word, ko, mn });
  });
  return { rows, bad };
}

function exportBackup() {
  const blob = new Blob([JSON.stringify(S, null, 1)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `단어상자-백업-${dayKey()}.json`;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

function importBackup(text, mode) {
  let data;
  try { data = JSON.parse(text); } catch (e) { return "파일을 읽을 수 없습니다. 백업 JSON이 맞는지 확인해 주세요."; }
  if (!data || typeof data !== "object" || !data.custom && !data.cards) return "단어 상자 백업 파일이 아닙니다.";
  if (mode === "replace") {
    S = Object.assign(defaultState(), data);
  } else {
    S.custom = Object.assign({}, data.custom || {}, S.custom);
    Object.keys(data.cards || {}).forEach(k => { if (!S.cards[k]) S.cards[k] = data.cards[k]; });
  }
  S.settings = Object.assign(defaultState().settings, S.settings || {});
  saveState();
  buildIndex();
  SOURCES.forEach(s => { if (!S.settings.sources.includes(s)) S.settings.sources.push(s); });
  saveState();
  return null;
}

function writeLocal() {
  if (!storageOK) { memStore = JSON.parse(JSON.stringify(S)); return; }
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { storageOK = false; memStore = JSON.parse(JSON.stringify(S)); }
}

/* 앱이 상태를 바꿀 때마다 부르는 경로. 변경 시각을 찍고 클라우드 밀어넣기를 예약한다. */
function saveState() {
  S.updatedAt = Date.now();
  writeLocal();
  syncSoon();
}

/* ============================================================================
   3. DATE HELPERS  (local-time day keys, never UTC)
   ============================================================================ */
const DAY = 86400000;
function dayKey(d) {
  const x = d || new Date();
  return x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0") + "-" + String(x.getDate()).padStart(2, "0");
}
function keyToDate(k) { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); }
function addDays(k, n) { const d = keyToDate(k); d.setDate(d.getDate() + n); return dayKey(d); }
function daysBetween(a, b) { return Math.round((keyToDate(b) - keyToDate(a)) / DAY); }
function fmtKo(k) {
  const d = keyToDate(k);
  return `${d.getMonth() + 1}월 ${d.getDate()}일 (${"일월화수목금토"[d.getDay()]})`;
}

const BOX_INTERVAL = [0, 1, 3, 7, 16, 35];   // 한 달 이상 남았을 때의 기본 복습 사다리

/* 시험이 코앞이면 16일·35일 간격은 시험이 끝난 뒤에나 돌아온다.
   남은 기간 안에 5단계까지 최소 한 번씩은 다시 만나도록 간격을 압축한다. */
function boxDays() {
  const left = daysBetween(dayKey(), S.settings.examDate);
  if (!(left > 0) || left >= 30) return BOX_INTERVAL;
  if (left >= 21) return [0, 1, 3, 6, 10, 16];
  if (left >= 14) return [0, 1, 2, 4, 7, 11];
  if (left >= 7)  return [0, 1, 2, 3, 5, 7];
  return [0, 1, 1, 2, 3, 4];
}

    custom: {},                // id -> { word, means[], mn, ex[], src, added, ts }
    log: {},                   // dayKey -> { new, rev, right, wrong }
    tomb: {},                  // 지운 내 단어의 묘비. id -> 지운 시각(ms). 동기화 때 부활을 막는다
    lastOpen: dayKey(),
    updatedAt: 0               // 이 기기가 마지막으로 손댄 시각(ms)
  };
}

let S = loadState() || defaultState();
// forward-compat: fill any missing settings keys
S.settings = Object.assign(defaultState().settings, S.settings || {});
S.cards = S.cards || {};
S.custom = S.custom || {};
S.log = S.log || {};
S.tomb = S.tomb || {};

buildIndex();
// 새로 생긴 출처는 기본으로 켜둔다
SOURCES.forEach(s => { if (!S.settings.sources.includes(s)) S.settings.sources.push(s); });

/* ============================================================================
   5. QUEUE
   ============================================================================ */
function activeWords() {
  const rs = new Set(S.settings.ranks);
  const ss = new Set(S.settings.sources || []);
  // 내 단어장에 등록한 단어는 순위 범위 밖이어도 켜져 있으면 항상 포함된다
  return WORDS.filter(w => (w.rank >= 0 && rs.has(w.rank)) || w.marks.some(m => ss.has(m)));
}
function todayLog() {
  const k = dayKey();
  if (!S.log[k]) S.log[k] = { new: 0, rev: 0, right: 0, wrong: 0, mine: 0, quota: 0 };
  if (S.log[k].mine == null) S.log[k].mine = 0;   // 옛 기록 보정
  return S.log[k];
}
function dueCards() {
  const t = dayKey();
  return activeWords().filter(w => {
    const c = S.cards[w.id];
    return c && c.due <= t;
  }).sort((a, b) => {
    const ca = S.cards[a.id], cb = S.cards[b.id];
    return (ca.due < cb.due ? -1 : ca.due > cb.due ? 1 : ca.box - cb.box);
  });
}
/* 기본 단어장에서 아직 한 번도 안 나온 단어 수. 내가 등록한 단어는 빼고 센다. */
function untouchedBase() {
  return activeWords().filter(w => !S.cards[w.id] && !w.marks.length).length;
}

/* 그날 낼 기본 단어 수를 남은 기간에서 역산한다.

   사용자가 직접 정하던 값이었는데, 정확히 맞추기 어렵고(남은 단어 ÷ 남은 날짜를
   손으로 계산해야 한다) 한 번 정하면 시험이 가까워져도 그대로라 뒤로 갈수록 모자란다.
   그래서 없애고 매일 다시 계산한다. 하루 밀리면 다음날 몫이 알아서 늘어난다.

   하루 안에서는 값을 고정한다. 풀수록 남은 단어가 줄어 목표가 같이 줄어들면
   오늘치가 영영 안 끝나는 것처럼 보이기 때문이다. */
function dailyQuota() {
  const L = todayLog();
  if (!L.quota) {
    const left = Math.max(1, daysBetween(dayKey(), S.settings.examDate));
    L.quota = Math.max(1, Math.ceil(untouchedBase() / left));
  }
  return L.quota;
}

/* 새 단어를 '내가 등록한 것'과 '기본 단어장'으로 나눠서 낸다.

   하루 몫(dailyQuota)은 기본 단어장에만 건다. 내가 오늘 200개를 등록했으면
   그 200개는 오늘 다 나온다 — 등록은 "이건 오늘 외우겠다"는 뜻이지, 기본 단어장
   진도를 200개 늦추겠다는 뜻이 아니기 때문이다. 한 한도를 같이 쓰면 등록할수록
   기본 진도가 멈춰서 시험 전에 한 바퀴를 못 돈다. */
function newSplit() {
  const L = todayLog();
  const untouched = activeWords().filter(w => !S.cards[w.id]);
  const mine = untouched.filter(w => w.marks.length > 0).sort((a, b) => a.idx - b.idx);
  const remaining = Math.max(0, dailyQuota() - L.new);
  const base = untouched.filter(w => !w.marks.length).sort((a, b) => a.idx - b.idx).slice(0, remaining);
  return { mine, base };
}
function newCards() {
  const s = newSplit();
  // 내가 등록한 단어를 앞에 낸다 — 책에서 방금 외운 단어가 1200개 뒤로 밀리면 안 된다
  return s.mine.concat(s.base);
}
function buildQueue() {
  const due = dueCards(), fresh = newCards();
  // interleave: a couple of reviews, then a new word — keeps sessions from feeling like a wall
  const out = [];
  let i = 0, j = 0;
  while (i < due.length || j < fresh.length) {
    for (let n = 0; n < 3 && i < due.length; n++) out.push({ w: due[i++], isNew: false });
    if (j < fresh.length) out.push({ w: fresh[j++], isNew: true });
  }
  return out;
}
function chunkSize() { return Math.max(5, Math.min(200, S.settings.chunk || 25)); }

function wrongNotes() {
  return activeWords()
    .filter(w => S.cards[w.id] && S.cards[w.id].wrong > 0)
    .sort((a, b) => S.cards[b.id].wrong - S.cards[a.id].wrong);
}
function stats() {
  const act = activeWords();
  const learned = act.filter(w => S.cards[w.id] && S.cards[w.id].box >= MAX_BOX).length;
  const learning = act.filter(w => S.cards[w.id] && S.cards[w.id].box < MAX_BOX).length;
  const boxes = [0, 0, 0, 0, 0, 0];
  act.forEach(w => { const c = S.cards[w.id]; boxes[c ? c.box : 0]++; });
  return { total: act.length, learned, learning, untouched: act.length - learned - learning, boxes };
}

/* ============================================================================
   6. GRADING
   ============================================================================ */
function grade(word, correct) {
  const t = dayKey();
  const c = S.cards[word.id] || { box: 0, due: t, right: 0, wrong: 0, first: t };
  const wasNew = !S.cards[word.id];
  if (correct) {
    // 처음 본 단어를 바로 맞혔다 = 이미 아는 단어. 1단계(내일)에 묶어두면
    // 아는 단어가 매일 복습 자리를 잡아먹으므로 2단계(3일 뒤)로 건너뛴다.
    c.box = wasNew ? 2 : Math.min(MAX_BOX, c.box + 1);
    c.right++;
  } else { c.box = 1; c.wrong++; }
  c.due = addDays(t, boxDays()[c.box]);
  c.ts = Date.now();          // 기기 간 병합에서 어느 쪽이 최신인지 가리는 기준
  S.cards[word.id] = c;

  const L = todayLog();
  // 하루 한도는 기본 단어장에만 걸리므로 내 단어는 따로 센다
  if (wasNew) { if (word.marks && word.marks.length) L.mine++; else L.new++; } else L.rev++;
  if (correct) L.right++; else L.wrong++;
  saveState();
  return c;
}

/* ============================================================================
   7. SPEECH
   ============================================================================ */
let voice = null;
function pickVoice() {
  if (!("speechSynthesis" in window)) return;
  const vs = speechSynthesis.getVoices();
  voice = vs.find(v => /en-US/i.test(v.lang) && /natural|google|samantha|zira/i.test(v.name))
       || vs.find(v => /^en[-_]/i.test(v.lang)) || null;
}
if ("speechSynthesis" in window) {
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}
function speak(text) {
  if (!("speechSynthesis" in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US"; u.rate = .88;
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  } catch (e) { /* no voice available — silent */ }
}

   ============================================================================ */
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
function shuffle(a) { const x = a.slice(); for (let i = x.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [x[i], x[j]] = [x[j], x[i]]; } return x; }
function pick(arr, n, exclude) {
  const pool = arr.filter(v => !exclude || !exclude.includes(v));
  return shuffle(pool).slice(0, n);
}
function primaryKo(w) { return w.means.map(m => m.ko).join(" / "); }
/* 4지선다 보기는 대표 뜻 하나만 — 두 뜻을 다 붙이면 보기가 길어지고 답이 티난다 */
function firstKo(w) { return w.means[0].ko; }
function highlight(sentence, word) {
  const stem = word.length > 5 ? word.slice(0, Math.ceil(word.length * .7)) : word;
  const re = new RegExp("\\b(" + stem.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\w*)", "i");
  return esc(sentence).replace(re, "<em>$1</em>");
}

/* 지금 켜져 있는 순위 구간을 "1–600" 같은 한 줄로. 범위가 조용히 바뀌면
   미학습 개수가 갑자기 줄어 진도가 날아간 것처럼 보이므로 항상 화면에 띄운다. */
function rangeLabel() {
  const rs = [...(S.settings.ranks || [])].sort((a, b) => a - b);
  const metas = RANK_META.filter(r => rs.includes(r.i));
  if (!metas.length) return "내 단어만";
  const lo = metas[0].label.split("–")[0];
  const hi = metas[metas.length - 1].label.split("–")[1];
  const contiguous = metas.length === (rs[rs.length - 1] - rs[0] + 1);
  return contiguous ? `${lo}–${hi}` : `${lo}–${hi} 중 ${metas.length}구간`;
}

/* 남은 기간에 비해 범위가 너무 넓으면, 줄였을 때의 페이스를 같이 보여준다.
   하루 60개가 넘어가면 새 단어를 훑기만 하고 복습이 밀려 결국 아무것도 안 남는다. */
function paceWarning(pace, dLeft) {
  if (pace <= 60 || dLeft <= 0) return "";
  const paceFor = n => {
    const rs = new Set(RANK_META.filter(r => r.i * 100 < n).map(r => r.i));
    const un = WORDS.filter(w => w.rank >= 0 && rs.has(w.rank) && !S.cards[w.id]).length;
    return Math.ceil(un / dLeft);
  };
  const opts = [600, 1200].filter(n => paceFor(n) > 0 && paceFor(n) < pace);
  if (!opts.length) return "";
  return `<div class="note">
    <b>하루 ${pace}개</b>는 복습까지 하면 버티기 어려운 양입니다. 학습 범위를 줄이면
    같은 기간에 더 확실히 남습니다. 지금 범위는 <b>${rangeLabel()}</b>입니다.
    <div class="link-row" style="margin-top:8px">
      ${opts.map(n => `<button class="sbtn" data-preset="${n}">1–${n}로 줄이기 · 하루 ${paceFor(n)}개</button>`).join("")}
    </div>
    <span class="field-d" style="display:block;margin-top:6px">범위를 줄여도 풀어둔 진도는 그대로 남습니다.
      설정 → 학습 범위에서 언제든 되돌릴 수 있습니다.</span>
  </div>`;
}

function modeBtn(id, title, desc, isDefault, wide) {
  const on = S.settings.mode === id;
  return `<button class="mode-btn ${wide ? "" : ""}" data-mode="${id}" aria-pressed="${on}">
    <span class="mt">${title}</span><span class="md">${desc}</span></button>`;
}

/* ============================================================================
   11. SESSION
   ============================================================================ */
function modeFor(entry) {
  const m = S.settings.mode;
  if (m !== "auto") {
    // derivative/synonym need data; fall back when a word lacks it
    if (m === "derivative" && (!entry.w.der || !entry.w.der.length)) return "choice";
    if (m === "synonym" && (!entry.w.syn || entry.w.syn.length < 1)) return "choice";
    return m;
  }
  const c = S.cards[entry.w.id];
  const box = c ? c.box : 0;
  if (box === 0) return "flash";
  if (box <= 2) return "choice";
  if (box === 3 && entry.w.der && entry.w.der.length) return "derivative";
  return "spell";
}

function startSession(list, label) {
  // 하루 100개를 한 번에 앉아서 푸는 건 무리라, 오늘 큐를 한 입 크기로 잘라서 낸다
  const q = list || buildQueue().slice(0, chunkSize());
  if (!q.length) return;
  session = {
    label: label || "오늘 학습",
    queue: q,
    i: 0,
    right: 0, wrong: 0,
    revealed: false,
    lastCorrect: null,
    lastCard: null,
    picked: null,
    typed: "",
    opts: null,
    mode: null
  };
  prepCurrent();
  go("study");
}

function prepCurrent() {
  const e = session.queue[session.i];
  session.revealed = false;
  session.hint = false;
  session.picked = null;
  session.typed = "";
  session.mode = modeFor(e);
  session.opts = buildOptions(e.w, session.mode);
  if (S.settings.autoSpeak && (session.mode === "flash" || session.mode === "choice")) {
    setTimeout(() => speak(e.w.word), 180);
  }
}

function buildOptions(w, mode) {
  if (mode === "choice") {
    // 오답 보기는 같은 품사에서 뽑는다 — 품사만 보고 찍는 걸 막아야 뜻을 실제로 테스트한다
    const same = (BY_POS[w.mainPos] || []).filter(x => x.id !== w.id);
    const src = same.length >= 8 ? same : WORDS.filter(x => x.id !== w.id);
    const correct = firstKo(w);
    const seen = new Set([correct]);
    const others = [];
    for (const x of shuffle(src)) {
      const t = firstKo(x);
      if (seen.has(t)) continue;
      seen.add(t);
      others.push(t);
      if (others.length === 3) break;
    }
    return shuffle([{ t: correct, ok: true }, ...others.map(t => ({ t, ok: false }))]);
  }
  if (mode === "synonym") {
    const correct = w.syn[0];
    const pool = WORDS.filter(x => x.id !== w.id).flatMap(x => (x.syn || []).concat([x.word]));
    const others = pick([...new Set(pool)], 3, w.syn.concat([w.word]));
    return shuffle([{ t: correct, ok: true }, ...others.map(t => ({ t, ok: false }))]);
  }
  if (mode === "derivative") {
    const d = w.der[Math.floor(Math.random() * w.der.length)];
    const pool = WORDS.filter(x => x.id !== w.id).flatMap(x => (x.der || []).map(y => y.w));
    const others = pick([...new Set(pool)], 3, w.der.map(y => y.w).concat([w.word]));
    return { ask: d, list: shuffle([{ t: d.w, ok: true }, ...others.map(t => ({ t, ok: false }))]) };
  }
  return null;
}

function answer(correct) {
  if (session.revealed) return;
  const w = session.queue[session.i].w;
  // 채점을 되돌릴 수 있게 직전 상태를 찍어둔다 (플래시카드는 답을 보기 전에 스스로 매기므로)
  session.prevCard = S.cards[w.id] ? Object.assign({}, S.cards[w.id]) : null;
  session.prevLog = Object.assign({}, todayLog());
  session.revealed = true;
  session.lastCorrect = correct;
  session.lastCard = grade(w, correct);
  if (correct) session.right++; else session.wrong++;
  if (!correct || session.mode === "spell") speak(w.word);
  render();
}

/* 답을 보고 나서 "사실 몰랐어" / "오타였어"로 채점을 뒤집는다. 여러 번 눌러도 된다. */
function regrade() {
  if (!session || !session.revealed) return;
  const w = session.queue[session.i].w;

  // 직전 채점 취소
  if (session.prevCard) S.cards[w.id] = session.prevCard; else delete S.cards[w.id];
  S.log[dayKey()] = session.prevLog;
  if (session.lastCorrect) session.right--; else session.wrong--;

  // 반대로 다시 채점
  const flipped = !session.lastCorrect;
  session.prevCard = S.cards[w.id] ? Object.assign({}, S.cards[w.id]) : null;
  session.prevLog = Object.assign({}, todayLog());
  session.lastCard = grade(w, flipped);
  session.lastCorrect = flipped;
  if (flipped) session.right++; else session.wrong++;
  render();
}

function next() {
  session.i++;
  if (session.i >= session.queue.length) { go("summary"); return; }
  prepCurrent();
  render();
}

  const M = session.mode;

  let body = "";

  else if (M === "choice")     body = cardChoice(w, e);
  else if (M === "spell")      body = cardSpell(w, e);
  else if (M === "derivative") body = cardDerivative(w, e);
  else if (M === "synonym")    body = cardSynonym(w, e);

  return `
  <div class="study">
    <div class="study-bar"><div class="study-bar-in">
      <button class="icon-btn" data-act="quit" aria-label="나가기">${ICON.back}</button>
      <div class="sess-rail"><div class="sess-fill" style="width:${prog}%"></div></div>

    <div class="stage">
      <div class="card" id="card">
        <div class="card-meta">
          <span class="tag ${e.isNew ? "is-new" : ""}">${e.isNew ? "새 단어" : modeLabel(M)}</span>

function modeLabel(m) {
  return { flash: "플래시카드", choice: "4지선다", spell: "스펠링", derivative: "파생어", synonym: "동의어" }[m] || "복습";
}

/* 연상이 있는 단어는 답을 보기 전에 힌트로 꺼내 볼 수 있다 — 경선식 방식 그대로 */
function hintBlock(w) {
  if (!w.mn) return "";
  return session.hint
    ? `<p class="mn-hint">${esc(w.mn)}</p>`
    : `<button class="speak" data-act="hint">💡 연상 힌트</button>`;
}

function cardFlash(w) {
  if (!session.revealed) {
    return `<p class="q-word">${esc(w.word)}</p>

  }
  return `<p class="q-word">${esc(w.word)}</p>

    <p class="q-ko">${esc(primaryKo(w))}</p>`;
}

function cardChoice(w) {
  return `<p class="q-word">${esc(w.word)}</p>
    <button class="speak" data-act="speak">${ICON.sound} 발음 듣기</button>
    ${session.revealed ? "" : hintBlock(w)}
    <div class="opts">${optsHTML(session.opts)}</div>`;
}

function cardSynonym(w) {
  return `<p class="q-word">${esc(w.word)}</p>
    <p class="q-hint">뜻이 가장 가까운 단어는?</p>
    <div class="opts">${optsHTML(session.opts)}</div>`;
}

function cardDerivative(w) {
  const ask = session.opts.ask;
  return `<p class="q-ko">${esc(w.word)}</p>
    <p class="q-hint"><b>${esc(ask.pos)}</b> 형태는? <span style="color:var(--text-3)">(${esc(ask.ko)})</span></p>
    <div class="opts">${optsHTML(session.opts.list)}</div>`;
}

function optsHTML(list) {
  return list.map((o, i) => {
    let cls = "";
    if (session.revealed) {
      if (o.ok) cls = "is-ok";
      else if (session.picked === i) cls = "is-bad";
      else cls = "is-dim";
    }
    return `<button class="opt ${cls}" data-opt="${i}" ${session.revealed ? "disabled" : ""}>
      <span class="k num">${i + 1}</span><span>${esc(o.t)}</span></button>`;
  }).join("");
}

function cardSpell(w) {
  const masked = w.word.split("").map((ch, i) => (i === 0 || ch === " " || ch === "-") ? ch : "_").join("");
  const cls = session.revealed ? (session.lastCorrect ? "is-ok" : "is-bad") : "";
  return `<p class="q-ko">${esc(primaryKo(w))}</p>
    <p class="q-pos">${esc(w.means.map(m => m.pos).join(" · "))}</p>
    <div class="spellwrap">
      <p class="spell-mask">${esc(masked)}</p>

        autocorrect="off" spellcheck="false" placeholder="영단어를 입력하세요"
        value="${esc(session.revealed ? w.word : session.typed)}" ${session.revealed ? "disabled" : ""}>
    </div>`;
}

function revealPanel(w) {
  const c = session.lastCard;
  const days = boxDays()[c.box];
  const nextTxt = c.box >= MAX_BOX ? `완료 · ${days}일 뒤 확인` : `${days}일 뒤 다시 나옵니다`;
  return `

      <p class="mn-text">${esc(w.mn)}</p>
    </div>` : ""}

    <div class="rv-sec">
      <span class="rv-label">뜻</span>
      ${w.means.map(m => `<p class="rv-mean">${m.pos ? `<span class="pos">${esc(m.pos)}</span>` : ""}${esc(m.ko)}</p>`).join("")}
    </div>

    ${(w.ex && w.ex.length) ? `
    <div class="rv-sec">
      <span class="rv-label">예문</span>
      ${w.ex.slice(0, 2).map(x => `
        <div>
          <p class="rv-ex-en">${highlight(x.en, w.word)}</p>
          <p class="rv-ex-ko">${esc(x.ko)}</p>
        </div>`).join("")}
    </div>` : ""}

    ${(w.col && w.col.length) ? `
    <div class="rv-sec">

      <div class="chips">${w.col.map(x => `<span class="chip"><b>${esc(x)}</b></span>`).join("")}</div>
    </div>` : ""}

    ${(w.der && w.der.length) ? `
    <div class="rv-sec">
      <span class="rv-label">파생어 · 품사 문제 대비</span>
      <div class="chips">${w.der.map(d => `<span class="chip"><span class="p">${esc(d.pos)}</span><b>${esc(d.w)}</b> ${esc(d.ko)}</span>`).join("")}</div>
    </div>` : ""}

    ${(w.syn && w.syn.length) ? `
    <div class="rv-sec">
      <span class="rv-label">동의어 · Part 7 패러프레이징</span>
      <div class="chips">${w.syn.map(s => `<span class="chip"><b>${esc(s)}</b></span>`).join("")}</div>
    </div>` : ""}
  </div>`;
}

function gradeButtons() {
  if (session.revealed) {
    const last = session.i === session.queue.length - 1;
    const flipLabel = session.lastCorrect
      ? (session.mode === "choice" ? "찍었어요" : "사실 몰랐어요")
      : "알고 있었어요";
    const flip = `<button class="gbtn g-flip ${session.lastCorrect ? "g-bad" : "g-ok"}" data-act="regrade">
        ${flipLabel} <span class="kbd">R</span></button>`;
    return flip + `<button class="gbtn g-go" data-act="next">${last ? "결과 보기" : "다음"} <span class="kbd">Space</span></button>`;
  }
  if (session.mode === "flash") {
    return `<button class="gbtn g-bad" data-act="no">모르겠어요 <span class="kbd">1</span></button>
            <button class="gbtn g-ok" data-act="yes">알아요 <span class="kbd">2</span></button>`;
  }
  if (session.mode === "spell") {
    return `<button class="gbtn g-go" data-act="submit">확인 <span class="kbd">Enter</span></button>`;
  }
  return `<button class="gbtn" data-act="dontknow" style="color:var(--text-2)">모르겠어요</button>`;
}

/* ============================================================================
   15b. CLOUD SYNC  (GitHub 비공개 Gist)
   ----------------------------------------------------------------------------
   왜 Gist인가: 서버를 세우지 않아도 되고, 데이터가 남의 서비스가 아니라 본인
   GitHub 계정 안에 남는다. 토큰 하나만 있으면 폰·PC·다른 브라우저가 같은 기록을
   본다.

   병합 원칙 — 두 기기에서 각자 공부했을 수 있으므로 통째로 덮어쓰지 않는다:
     · 카드    : id마다 ts(마지막으로 채점한 시각)가 큰 쪽
     · 내 단어 : id마다 ts가 큰 쪽. 단 묘비(tomb)가 더 최근이면 되살리지 않는다
     · 기록    : 같은 날짜는 항목별 최댓값 (합치면 재동기화마다 불어난다)
     · 설정    : 통째로 최근에 저장된 쪽
   ============================================================================ */
var syncReady = false;                 // 초기화 전 saveState() 호출에도 안전하도록 var

const SYNC_KEY  = "voca-box-sync-v1";  // { token, gistId } — 상태(S)와 분리해서 Gist에 안 올라가게
const GIST_FILE = "voca-box-state.json";
const GIST_DESC = "단어 상자 — 학습 기록 동기화 (voca-box)";
const SYNC_DEBOUNCE = 2500;
const SYNC_POLL = 180000;              // 켜둔 채로 두면 3분마다 다른 기기 변경을 받아온다

let SY = { token: "", gistId: "" };
let syncing = false, syncQueued = false, syncTimer = null, pollTimer = null;
let syncStatus = { state: "off", msg: "", at: 0 };
let syncMsg = "";                      // 설정 시트에 띄우는 오류/안내
let tokenDraft = "";                   // 시트가 다시 그려져도 입력 중인 토큰이 날아가지 않도록

function loadSyncCfg() {
  try {
    const o = JSON.parse(localStorage.getItem(SYNC_KEY) || "null");
    if (o && typeof o === "object") return { token: o.token || "", gistId: o.gistId || "" };
  } catch (e) {}
  return { token: "", gistId: "" };
}
function saveSyncCfg() { try { localStorage.setItem(SYNC_KEY, JSON.stringify(SY)); } catch (e) {} }

function syncOn() { return !!(SY.token && SY.gistId); }

function setSyncStatus(state, msg) {
  syncStatus = { state, msg: msg || "", at: state === "ok" ? Date.now() : syncStatus.at };
  paintSync();
}

/* 상태 표시만 갈아끼운다. 공부 중이거나 입력 중일 때 화면 전체를 다시 그리면
   포커스와 스크롤이 튀기 때문에 점·문구만 손댄다. */
function paintSync() {
  document.querySelectorAll("[data-sync-dot]").forEach(el => { el.className = "sync-dot " + syncStatus.state; });
  document.querySelectorAll("[data-sync-msg]").forEach(el => { el.textContent = syncText(); });
  const chip = document.querySelector(".sync-chip");
  if (chip) chip.classList.toggle("err", syncStatus.state === "err");
}

function syncText() {
  if (!syncOn()) return "연결 안 됨";
  if (syncStatus.state === "busy") return "동기화 중…";
  if (syncStatus.state === "err") return syncStatus.msg || "동기화 실패";
  if (syncStatus.state === "offline") return "오프라인 — 연결되면 자동으로 올립니다";
  if (syncStatus.state === "ok") return "동기화됨 · " + fmtClock(syncStatus.at);
  return "대기 중";
}
function fmtClock(ms) {
  if (!ms) return "";
  const d = new Date(ms);
  return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
}

function syncChip() {
  if (!syncOn()) return "";
  return `<button class="sync-chip${syncStatus.state === "err" ? " err" : ""}" data-act="settings" aria-label="동기화 상태">
      <span class="sync-dot ${syncStatus.state}" data-sync-dot></span><span data-sync-msg>${esc(syncText())}</span>
    </button>`;
}

/* ---- 병합 ---------------------------------------------------------------- */
function pickCard(x, y) {
  const xt = +x.ts || 0, yt = +y.ts || 0;
  if (xt || yt) return yt > xt ? y : x;
  // ts가 없는 옛 기록끼리는 더 많이 푼 쪽이 더 앞서 있다
  const xn = (+x.right || 0) + (+x.wrong || 0), yn = (+y.right || 0) + (+y.wrong || 0);
  return yn > xn ? y : x;
}

function mergeStates(A, B) {
  A = A || {}; B = B || {};
  const aT = +A.updatedAt || 0, bT = +B.updatedAt || 0;
  const newer = aT >= bT ? A : B;                       // 단일 값(설정 등)은 최근에 저장된 쪽
  const out = JSON.parse(JSON.stringify(newer));

  const tomb = {};
  [A.tomb || {}, B.tomb || {}].forEach(t => {
    Object.keys(t).forEach(k => { tomb[k] = Math.max(tomb[k] || 0, +t[k] || 0); });
  });
  out.tomb = tomb;

  out.cards = {};
  new Set([...Object.keys(A.cards || {}), ...Object.keys(B.cards || {})]).forEach(id => {
    const x = (A.cards || {})[id], y = (B.cards || {})[id];
    out.cards[id] = !x ? y : !y ? x : pickCard(x, y);
  });

  out.custom = {};
  new Set([...Object.keys(A.custom || {}), ...Object.keys(B.custom || {})]).forEach(id => {
    const x = (A.custom || {})[id], y = (B.custom || {})[id];
    const win = !x ? y : !y ? x : ((+y.ts || 0) > (+x.ts || 0) ? y : x);
    // 지운 뒤로 다시 등록한 적이 없으면 되살리지 않는다
    if (tomb[id] && tomb[id] >= (+win.ts || 0)) return;
    out.custom[id] = win;
  });

  out.log = {};
  new Set([...Object.keys(A.log || {}), ...Object.keys(B.log || {})]).forEach(d => {
    const x = (A.log || {})[d] || {}, y = (B.log || {})[d] || {};
    out.log[d] = {
      new:   Math.max(+x.new   || 0, +y.new   || 0),
      rev:   Math.max(+x.rev   || 0, +y.rev   || 0),
      right: Math.max(+x.right || 0, +y.right || 0),
      wrong: Math.max(+x.wrong || 0, +y.wrong || 0),
      mine:  Math.max(+x.mine  || 0, +y.mine  || 0),
      quota: Math.max(+x.quota || 0, +y.quota || 0),
    };
  });

  out.settings = Object.assign(defaultState().settings, newer.settings || {});
  out.lastOpen = (A.lastOpen || "") > (B.lastOpen || "") ? A.lastOpen : B.lastOpen;
  out.updatedAt = Math.max(aT, bT);
  return out;
}

/* ---- GitHub API ---------------------------------------------------------- */
function ghHeaders() {
  return {
    "Authorization": "Bearer " + SY.token,
    "Accept": "application/vnd.github+json",
    "X-GitHub-Api-Version": "2022-11-28",
    "Content-Type": "application/json",
  };
}

async function gh(path, method, body) {
  let r;
  try {
    r = await fetch("https://api.github.com" + path, {
      method: method || "GET",
      headers: ghHeaders(),
      body: body ? JSON.stringify(body) : undefined,
    });
  } catch (e) {
    const err = new Error("네트워크에 연결할 수 없습니다.");
    err.offline = true;
    throw err;
  }
  if (!r.ok) {
    throw new Error(
      r.status === 401 ? "토큰이 잘못됐거나 만료됐습니다. 새 토큰으로 다시 연결해 주세요."
    : r.status === 403 ? "토큰에 gist 권한이 없거나 요청이 너무 잦습니다."
    : r.status === 404 ? "Gist를 찾을 수 없습니다. 연결을 해제하고 다시 연결해 주세요."
    : "GitHub 오류 " + r.status);
  }
  return r.json();
}

/* 이미 만들어 둔 동기화 Gist가 있으면 그걸 쓰고, 없으면 새로 만든다.
   두 번째 기기에서 같은 토큰을 넣으면 이 경로로 첫 기기의 Gist를 찾아 붙는다. */
async function findOrCreateGist() {
  const list = await gh("/gists?per_page=100");
  const hit = (list || []).find(g => g && g.files && g.files[GIST_FILE]);
  if (hit) return hit.id;
  const made = await gh("/gists", "POST", {
    description: GIST_DESC,
    public: false,
    files: { [GIST_FILE]: { content: JSON.stringify(S) } },
  });
  return made.id;
}

async function pullRemote() {
  const g = await gh("/gists/" + SY.gistId);
  const f = g && g.files && g.files[GIST_FILE];
  if (!f) return null;
  let text = f.content;
  // 1MB가 넘으면 content가 잘려서 오고 raw_url로만 온전히 받을 수 있다
  if (f.truncated || text == null) {
    const r = await fetch(f.raw_url);
    if (!r.ok) throw new Error("Gist 본문을 받지 못했습니다.");
    text = await r.text();
  }
  try {
    const o = JSON.parse(text);
    return (o && typeof o === "object" && (o.cards || o.custom)) ? o : null;
  } catch (e) { return null; }
}

function pushRemote(state) {
  return gh("/gists/" + SY.gistId, "PATCH", {
    files: { [GIST_FILE]: { content: JSON.stringify(state) } },
  });
}

/* ---- 동기화 구동 --------------------------------------------------------- */
function syncSoon(ms) {
  if (!syncReady || !syncOn()) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(doSync, ms == null ? SYNC_DEBOUNCE : ms);
}

async function doSync() {
  if (!syncOn() || syncing) { if (syncing) syncQueued = true; return; }
  clearTimeout(syncTimer);
  syncing = true;
  setSyncStatus("busy");
  try {
    const remote = await pullRemote();
    const before = JSON.stringify(S);

    if (remote) {
      S = mergeStates(S, remote);
      S.settings = Object.assign(defaultState().settings, S.settings || {});
      S.cards = S.cards || {}; S.custom = S.custom || {}; S.log = S.log || {}; S.tomb = S.tomb || {};
    }

    const changedHere = JSON.stringify(S) !== before;
    if (changedHere) {
      writeLocal();
      buildIndex();                      // 다른 기기에서 등록한 단어를 색인에 태운다
      SOURCES.forEach(s => { if (!S.settings.sources.includes(s)) S.settings.sources.push(s); });
      writeLocal();
    }

    if (!remote || JSON.stringify(S) !== JSON.stringify(remote)) await pushRemote(S);

    syncMsg = "";
    setSyncStatus("ok");
    if (changedHere) rerenderIfIdle();
  } catch (e) {
    if (!e.offline) syncMsg = e.message || "";
    setSyncStatus(e.offline ? "offline" : "err", e.message || "동기화에 실패했습니다.");
  } finally {
    syncing = false;
    if (syncQueued) { syncQueued = false; syncSoon(800); }
  }
}

/* 공부 중이거나 입력 중이면 화면을 다시 그리지 않는다 (포커스·스크롤이 튄다). */
function rerenderIfIdle() {
  if (view === "study" && session) return;
  const a = document.activeElement;
  if (a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA" || a.tagName === "SELECT")) return;
  render();
}

async function connectSync(token) {
  token = (token || "").trim();
  if (!token) { syncMsg = "토큰을 붙여넣어 주세요."; render(); return; }
  SY = { token, gistId: "" };
  syncMsg = "";
  setSyncStatus("busy");
  render();
  try {
    SY.gistId = await findOrCreateGist();
    saveSyncCfg();
    tokenDraft = "";
    syncReady = true;
    render();
    await doSync();
    startPoll();
  } catch (e) {
    SY = { token: "", gistId: "" };
    syncMsg = e.message || "연결에 실패했습니다.";
    setSyncStatus("off");
  }
  render();
}

function disconnectSync() {
  SY = { token: "", gistId: "" };
  try { localStorage.removeItem(SYNC_KEY); } catch (e) {}
  clearTimeout(syncTimer); clearInterval(pollTimer);
  syncMsg = "";
  setSyncStatus("off");
  render();
}

function startPoll() {
  clearInterval(pollTimer);
  pollTimer = setInterval(() => {
    if (!document.hidden && syncOn() && !(view === "study" && session)) doSync();
  }, SYNC_POLL);
}

function initSync() {
  SY = loadSyncCfg();
  syncReady = true;

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) { clearTimeout(syncTimer); doSync(); }
    else syncSoon(1000);
  });
  window.addEventListener("pagehide", () => { clearTimeout(syncTimer); doSync(); });
  window.addEventListener("online", () => syncSoon(500));

  if (!syncOn()) { setSyncStatus("off"); return; }
  setSyncStatus("busy");
  doSync();
  startPoll();
}

/* ---- 설정 시트 조각 ------------------------------------------------------ */
function syncField() {
  return `
      <div class="field">
        <span class="field-l">클라우드 동기화</span>
        <span class="field-d">학습 기록과 내 단어를 본인 GitHub 계정의 <b>비공개 Gist</b>에 저장합니다.
          다른 브라우저·폰에서 같은 토큰을 넣으면 같은 기록을 이어서 씁니다.</span>
        <div class="sync-row" style="margin-top:2px">
          <span class="sync-dot ${syncStatus.state}" data-sync-dot></span>
          <span data-sync-msg>${esc(syncText())}</span>
        </div>
        ${syncOn() ? `
        <div class="link-row" style="margin-top:6px">
          <button class="sbtn" data-act="syncNow">지금 동기화</button>
          <button class="sbtn danger" data-act="syncOff">연결 해제</button>
        </div>
        <span class="field-d">Gist ID <span class="sync-code">${esc(SY.gistId)}</span> —
          gist.github.com 에서 직접 열어볼 수 있습니다.</span>
        ` : `
        <input type="password" id="syncTok" placeholder="ghp_ 로 시작하는 토큰" value="${esc(tokenDraft)}"
               autocomplete="off" autocapitalize="off" spellcheck="false">
        <div class="link-row" style="margin-top:6px">
          <button class="sbtn primary" data-act="syncConnect">연결</button>
        </div>
        <span class="field-d">토큰 만들기: GitHub → Settings → Developer settings →
          Personal access tokens → <b>Tokens (classic)</b> → Generate new token →
          권한은 <b>gist</b> 하나만 체크. 이 토큰으로는 Gist 말고 아무것도 건드리지 못하고,
          토큰은 이 브라우저에만 저장됩니다.</span>
        `}
        ${syncMsg ? `<div class="warn">${esc(syncMsg)}</div>` : ""}
      </div>
`;
}

/* ============================================================================
   16. EVENTS
   ============================================================================ */
app.addEventListener("click", (ev) => {
  const t = ev.target;

  const opt = t.closest("[data-opt]");
  if (opt && session && !session.revealed) {
    const i = +opt.dataset.opt;
    const list = session.mode === "derivative" ? session.opts.list : session.opts;
    session.picked = i;
    answer(!!list[i].ok);
    return;
  }

  const speakBtn = t.closest("[data-speak]");
  if (speakBtn) { ev.stopPropagation(); speak(speakBtn.dataset.speak); return; }

  const item = t.closest("[data-item]");
  if (item) { openItem = openItem === item.dataset.item ? null : item.dataset.item; render(); return; }

  const modeEl = t.closest("[data-mode]");
  if (modeEl) { S.settings.mode = modeEl.dataset.mode; saveState(); render(); return; }

  const editEl = t.closest("[data-edit]");
  if (editEl) { ev.stopPropagation(); editing = editEl.dataset.edit; sheet = "add"; render(); return; }

  const delEl = t.closest("[data-del]");
  if (delEl) {
    ev.stopPropagation();
    const id = delEl.dataset.del;
    if (confirm(`"${S.custom[id].word}"을(를) 내 단어에서 지웁니다. 계속할까요?`)) {
      deleteCustom(id); openItem = null; render();
    }
    return;
  }

  const srcEl = t.closest("[data-src]");
  if (srcEl) {
    const s = srcEl.dataset.src;
    const set = new Set(S.settings.sources);
    if (set.has(s)) set.delete(s); else set.add(s);
    S.settings.sources = [...set];
    saveState(); render(); return;
  }

  const presetEl = t.closest("[data-preset]");
  if (presetEl) {
    const p = presetEl.dataset.preset;
    const n = p === "all" ? Infinity : +p;
    const before = rangeLabel();
    rangeUndo = [...S.settings.ranks];
    S.settings.ranks = RANK_META.filter(r => r.i * 100 < n).map(r => r.i);
    todayLog().quota = 0;      // 범위가 바뀌면 하루 몫도 달라진다
    saveState();
    // 범위를 좁히면 미학습 개수가 뚝 떨어져서 진도가 날아간 것처럼 보인다. 짚어준다.
    rangeNote = before === rangeLabel() ? "" : `학습 범위를 ${before} → ${rangeLabel()}로 바꿨습니다. 진도는 그대로입니다.`;
    render(); return;
  }

  const rankEl = t.closest("[data-rank]");
  if (rankEl) {
    const r = +rankEl.dataset.rank;
    const set = new Set(S.settings.ranks);
    if (set.has(r)) set.delete(r); else set.add(r);
    // 순위 구간을 전부 꺼도 되지만, 내 단어까지 없으면 학습할 게 남지 않는다
    const hasMine = (S.settings.sources || []).some(s => customCount(s) > 0);
    if (!set.size && !hasMine) set.add(r);
    S.settings.ranks = [...set].sort((a, b) => a - b);
    todayLog().quota = 0;      // 범위가 바뀌면 하루 몫도 달라진다
    saveState(); render(); return;
  }

  const btn = t.closest("[data-act]");
  if (!btn) return;
  const a = btn.dataset.act;

  if (a === "closeSheet" && t.closest("[data-stop]") && !btn.classList.contains("sbtn")) return;

  switch (a) {
    case "settings": sheet = "settings"; render(); break;
    case "closeSheet": sheet = null; render(); break;
    case "start": startSession(); break;
    case "home": go("dash"); break;
    case "wrong": go("wrong"); break;
    case "browse": go("browse"); break;
    case "quit": go("dash"); break;
    case "speak": speak(session.queue[session.i].w.word); break;
    case "yes": answer(true); break;
    case "no": answer(false); break;
    case "dontknow": answer(false); break;
    case "next": next(); break;
    case "regrade": regrade(); break;
    case "hint": session.hint = true; render(); break;

    case "my": go("my"); break;
    case "openAdd": editing = null; sheet = "add"; render(); break;
    case "openBulk": bulkPreview = null; sheet = "bulk"; render(); break;
    case "saveAdd": case "saveAddMore": doSaveAdd(a === "saveAddMore"); break;
    case "bulkCheck": doBulkCheck(); break;
    case "bulkSave": doBulkSave(); break;
    case "rangeUndo":
      if (rangeUndo) { S.settings.ranks = rangeUndo; rangeUndo = null; todayLog().quota = 0; saveState(); }
      rangeNote = ""; render();
      break;
    case "export": exportBackup(); break;
    case "syncConnect": connectSync(val("syncTok") || tokenDraft); break;
    case "syncOff":
      if (confirm("이 브라우저의 동기화 연결을 끊습니다. Gist에 저장된 기록은 그대로 남습니다. 계속할까요?")) disconnectSync();
      break;
    case "syncNow": syncMsg = ""; doSync(); break;
    case "importPick": { const f = document.getElementById("impFile"); if (f) f.click(); break; }
    case "submit": submitSpell(); break;
    case "drillWrong":
      startSession(shuffle(wrongNotes()).slice(0, 40).map(w => ({ w, isNew: false })), "오답 집중 훈련");
      break;
    case "redoWrong": {
      const ids = session.queue.filter(e => S.cards[e.w.id] && S.cards[e.w.id].box === 1).map(e => e.w);
      startSession(shuffle(ids).map(w => ({ w, isNew: false })), "오답 다시 풀기");
      break;
    }
    case "reset":
      if (confirm("학습 진도와 내가 등록한 단어를 모두 지웁니다. 되돌릴 수 없습니다. 계속할까요?")) {
        S = defaultState();
        saveState();
        buildIndex();          // 지운 내 단어가 색인에도 남지 않도록 다시 만든다
        importMsg = ""; lastSaved = null; editing = null; bulkPreview = null; openItem = null;
        sheet = null;
        syncSoon(0);           // 초기화는 곧바로 원격에도 반영한다
        go("dash");
      }
      break;
  }
});

app.addEventListener("input", (ev) => {
  if (ev.target.id === "spellIn") session.typed = ev.target.value;
  if (ev.target.id === "setExam" && ev.target.value) {
    S.settings.examDate = ev.target.value;
    todayLog().quota = 0;      // 남은 기간이 바뀌었으니 오늘 몫도 다시 계산한다
    saveState();
  }
  if (ev.target.id === "setChunk") { S.settings.chunk = Math.max(5, Math.min(200, +ev.target.value || 25)); saveState(); }
  if (ev.target.id === "setSpeak") { S.settings.autoSpeak = ev.target.value === "1"; saveState(); }
  if (ev.target.id === "syncTok") tokenDraft = ev.target.value;
});

/* ---- 내 단어 폼 처리 ---- */
let lastSaved = null, importMsg = "";
const val = id => { const e = document.getElementById(id); return e ? String(e.value || "") : ""; };
const WORD_RE = /^[A-Za-z][A-Za-z '\-]*$/;

function doSaveAdd(more) {
  const word = editing ? S.custom[editing].word : val("adWord");
  const ko = val("adKo"), pos = val("adPos"), mn = val("adMn"), src = val("adSrc");
  const box = document.getElementById("adMsg");
  const warn = m => { if (box) box.innerHTML = `<div class="warn">${m}</div>`; };

  if (!word.trim() || !ko.trim()) return warn("영단어와 뜻은 꼭 입력해 주세요.");
  if (!WORD_RE.test(word.trim())) return warn("영단어 칸에는 영문만 넣어 주세요.");

  saveCustom({ word, pos, ko, mn, src });
  lastSaved = word.trim();
  editing = null;

  if (more) { sheet = "add"; render(); return; }   // 폼을 비우고 계속 입력
  sheet = null;
  if (view === "my") render(); else go("my");
}

function doBulkCheck() {
  const raw = val("bkText"), src = val("bkSrc");
  const r = parseBulk(raw);
  bulkPreview = { raw, src, rows: r.rows, bad: r.bad };
  render();
}

function doBulkSave() {
  const raw = val("bkText");
  const src = val("bkSrc").trim() || "내 단어";
  const { rows, bad } = parseBulk(raw);
  if (!rows.length) { bulkPreview = { raw, src, rows, bad }; render(); return; }
  rows.forEach(r => saveCustom({ word: r.word, ko: r.ko, mn: r.mn, src, pos: "" }));
  lastSaved = null;
  bulkPreview = null;
  sheet = null;
  if (view === "my") render(); else go("my");
}

app.addEventListener("change", (ev) => {
  if (ev.target.id !== "impFile") return;
  const file = ev.target.files && ev.target.files[0];
  if (!file) return;
  const rd = new FileReader();
  rd.onload = () => {
    const err = importBackup(String(rd.result), "merge");
    importMsg = err || `불러왔습니다. 내 단어 ${customCount()}개.`;
    render();
  };
  rd.onerror = () => { importMsg = "파일을 읽지 못했습니다."; render(); };
  rd.readAsText(file);
});

function submitSpell() {
  if (!session || session.revealed) return;
  const w = session.queue[session.i].w;
  const norm = s => s.trim().toLowerCase().replace(/\s+/g, " ");
  answer(norm(session.typed) === norm(w.word));
}

document.addEventListener("keydown", (ev) => {
  if (view !== "study" || !session) return;
  const typing = document.activeElement && document.activeElement.id === "spellIn";

  if (ev.key === "Enter") {
    ev.preventDefault();
    if (session.revealed) next();
    else if (session.mode === "spell") submitSpell();
    return;
  }
  if (typing) return;

  if ((ev.key === "r" || ev.key === "R") && session.revealed) { ev.preventDefault(); regrade(); return; }

  if (ev.key === " ") {
    ev.preventDefault();
    if (session.revealed) next();
    return;
  }
  if (!session.revealed) {
    if (session.mode === "flash") {
      if (ev.key === "1") answer(false);
      if (ev.key === "2") answer(true);
    } else if (["1","2","3","4"].includes(ev.key)) {
      const i = +ev.key - 1;
      const list = session.mode === "derivative" ? session.opts.list : session.opts;
      if (list[i]) { session.picked = i; answer(!!list[i].ok); }
    }
  }
});

/* swipe on the card: left = 모름, right = 앎 (flash mode), any = next when revealed */
function afterRender() {
  if (!session) return;
  const inp = document.getElementById("spellIn");
  if (inp && !session.revealed) { inp.focus({ preventScroll: true }); }

  const card = document.getElementById("card");
  if (!card) return;
  let x0 = null, y0 = null;
  card.addEventListener("pointerdown", e => { x0 = e.clientX; y0 = e.clientY; });
  card.addEventListener("pointerup", e => {
    if (x0 == null) return;
    const dx = e.clientX - x0, dy = e.clientY - y0;
    x0 = null;
    if (Math.abs(dx) < 60 || Math.abs(dy) > 50) return;
    if (session.revealed) { next(); return; }
    if (session.mode === "flash") answer(dx > 0);
  });
}

/* daily rollover while the page stays open */
setInterval(() => {
  const k = dayKey();
  if (S.lastOpen !== k) { S.lastOpen = k; saveState(); if (view === "dash") render(); }
}, 60000);

render();
initSync();
</script>
